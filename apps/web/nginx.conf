server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  # SPA fallback — the room code lives in the query string, so all paths serve index.html.
  # index.html must never cache so a new deploy's hashed bundle is always picked up.
  location / {
    try_files $uri $uri/ /index.html;
    add_header Cache-Control "no-cache, no-store, must-revalidate";
  }

  # Long-cache hashed assets (content-hashed filenames make this safe).
  location /assets/ {
    expires 1y;
    add_header Cache-Control "public, immutable";
  }
}
